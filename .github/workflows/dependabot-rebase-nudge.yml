name: Nudge Dependabot rebase

# Weekly Dependabot opens several PRs from the same snapshot. When one auto-merges
# (often dev-dependencies), siblings can land with a stale pnpm-lock.yaml and never
# get CI until someone rebases. Comment @dependabot rebase on conflicted PRs.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened]

jobs:
  nudge-rebase:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Nudge conflicted Dependabot PRs
        run: |
          set -euo pipefail

          nudge_pr() {
            local pr="$1"
            local mergeable merge_state

            for _ in 1 2 3 4 5 6; do
              merge_state="$(gh pr view "$pr" --json mergeStateStatus --jq '.mergeStateStatus')"
              mergeable="$(gh pr view "$pr" --json mergeable --jq '.mergeable')"
              if [ "$merge_state" != "UNKNOWN" ]; then
                break
              fi
              sleep 10
            done

            if [ "$merge_state" != "DIRTY" ] && [ "$mergeable" != "CONFLICTING" ]; then
              echo "PR #$pr is mergeable (state=$merge_state, mergeable=$mergeable); skipping"
              return 0
            fi

            if gh pr view "$pr" --json comments --jq '.comments[].body' | grep -q 'dependabot-rebase-nudge'; then
              echo "PR #$pr already nudged"
              return 0
            fi

            gh pr comment "$pr" --body $'@dependabot rebase\n\n<!-- dependabot-rebase-nudge -->'
            echo "Nudged PR #$pr to rebase"
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.user.login }}" != "dependabot[bot]" ]; then
              echo "Not a Dependabot PR"
              exit 0
            fi
            nudge_pr "${{ github.event.pull_request.number }}"
            exit 0
          fi

          gh pr list --author "app/dependabot" --state open --json number --jq '.[].number' | while read -r pr; do
            [ -n "$pr" ] || continue
            nudge_pr "$pr"
          done
