name: Dependabot PR health

# Safety net for the weekly Monday Dependabot batch: re-dispatch CI when a PR never
# got a test check or the latest test failed. Lockfile conflicts are resolved by
# dependabot-lockfile-conflicts.yml. Also runs when a Dependabot PR merges.
on:
  schedule:
    # After the usual Monday ~18:00 UTC Dependabot batch (and Tuesday follow-up).
    - cron: '0 20 * * 1'
    - cron: '0 10 * * 2'
  pull_request:
    types: [closed]

jobs:
  check-open-dependabot-prs:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      # Not GITHUB_TOKEN: the branch update below must trigger CI on the PR.
      GH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Flag Dependabot PRs missing CI test check
        run: |
          set -euo pipefail

          gh pr list --author "app/dependabot" --state open --json number,headRefOid,headRefName \
            --jq '.[] | [.number, .headRefOid, .headRefName] | @tsv' | while IFS=$'\t' read -r pr sha branch; do
            [ -n "$pr" ] || continue

            test_conclusion="$(
              gh api "repos/${GH_REPO}/commits/${sha}/check-runs" --paginate \
                --jq '[.check_runs[] | select(.name == "test")] | last | .conclusion // empty'
            )"

            if [ -z "$test_conclusion" ]; then
              echo "PR #$pr ($branch) has no test check on head $sha — re-dispatching CI"
              gh workflow run ci.yml --ref "$branch"
              continue
            fi

            echo "PR #$pr has test check: $test_conclusion"

            if [ "$test_conclusion" = "failure" ]; then
              echo "PR #$pr ($branch) test failed on $sha — re-dispatching CI once"
              gh workflow run ci.yml --ref "$branch"
            fi
          done

      # Last, so the dispatch step above sees each PR's original head. A PR can be
      # created from a base a few minutes older than main (another Dependabot PR
      # merged in between) and then never be refreshed. Updating with a token other
      # than GITHUB_TOKEN triggers CI, and auto-merge then completes.
      - name: Update Dependabot PRs that are behind main
        run: |
          gh pr list --author "app/dependabot" --state open --json number,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "BEHIND") | .number' | while read -r pr; do
            [ -n "$pr" ] || continue
            echo "PR #$pr is behind main — updating branch"
            gh api -X PUT "repos/${GH_REPO}/pulls/${pr}/update-branch" ||
              echo "::warning::Could not update PR #$pr (merge conflict?). Needs a manual fix."
          done
