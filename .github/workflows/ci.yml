name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm build
      - run: pnpm run check:books-duplicates
      - run: pnpm run check:broken-tags
      - run: pnpm test

  dependabot-auto-merge:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      # "Update branch" and the merge itself must not use GITHUB_TOKEN: pushes it
      # makes do not trigger CI on the PR, and its merge does not trigger CI on
      # main or the workflows that refresh other Dependabot PRs. On Dependabot PR
      # runs, DEPENDABOT_PUSH_TOKEN must exist as a Dependabot secret.
      GH_TOKEN: ${{ secrets.DEPENDABOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: dependabot/fetch-metadata@v2
        id: metadata

      # Read the live merge state: the pull_request event payload is captured when
      # the PR opens, when mergeable_state is usually unknown, and goes stale while
      # CI runs (main often moves, e.g. another Dependabot PR merging).
      - name: Update branch if behind base
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          state=""
          for attempt in 1 2 3 4 5; do
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
            [ "$state" != "UNKNOWN" ] && break
            sleep 5
          done
          echo "Merge state: $state"
          if [ "$state" = "BEHIND" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/update-branch"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Auto-merge patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
          if [ "$(gh pr view "$PR_URL" --json state,autoMergeRequest --jq '.state == "MERGED" or .autoMergeRequest != null')" != "true" ]; then
            echo "::warning::Auto-merge is not enabled on $PR_URL. A maintainer needs to merge it."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label list --json name --jq '.[].name' | grep -qx breaking-change || \
            gh label create "breaking-change" \
              --description "Major dependency update requiring manual review" \
              --color "d93f0b"
          gh pr edit "$PR_URL" --add-label "breaking-change"
          COMMENT_BODY=$'Major version bump — needs manual review before merge.\n\nA maintainer or Cloud Agent should post a full review checklist on this PR (see AGENTS.md → Dependabot major version bumps). That comment should include `<!-- dependabot-major-review-checklist -->`.\n\n<!-- dependabot-major-review -->'
          if ! gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -q 'dependabot-major-review'; then
            gh pr comment "$PR_URL" --body "$COMMENT_BODY"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
